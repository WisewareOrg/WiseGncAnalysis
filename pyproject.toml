[project]
name = "gnc-analysis"
version = "0.1.0"
description = "Analysis against the recorded-run contract: attitude-error scoring for GNC campaigns."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.scripts]
gnc-analyze = "gnc_analysis.imu_dead_reckoning:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis/gnc_analysis"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
